<app-header></app-header>

<main>
    <section class="formulario">
        <h2>Iniciar sesión</h2>

        <form class="form-login" [formGroup]="formularioLogin" (ngSubmit)="onLogin()">
            <!-- Usuario -->
            <div class="form-datos">
                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" name="usuario" formControlName="usuario"
                    placeholder="Introduce tu usuario">

                <div *ngIf="formularioLogin.get('usuario')?.errors && formularioLogin.get('usuario')?.touched">
                    <p *ngIf="formularioLogin.get('usuario')?.hasError('required')">*Este campo es obligatorio.</p>
                </div>
            </div>

            <!-- Contraseña -->
            <div class="form-datos">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" formControlName="password"
                    placeholder="Introduce tu contraseña">

                <div *ngIf="formularioLogin.get('password')?.errors && formularioLogin.get('password')?.touched">
                    <p *ngIf="formularioLogin.get('password')?.hasError('required')">*Este campo es obligatorio.</p>
                </div>
            </div>

            <!-- Botón -->
            <div class="botones">
                <button type="submit" class="btn">Iniciar sesión</button>
            </div>

            <!-- Enlace para registrarse -->
            <p class="registro-texto">
                ¿No tienes cuenta?
                <a routerLink="/registroUsuarios" routerLinkActive="active">Regístrate aquí</a>
            </p>
        </form>
    </section>
</main>
