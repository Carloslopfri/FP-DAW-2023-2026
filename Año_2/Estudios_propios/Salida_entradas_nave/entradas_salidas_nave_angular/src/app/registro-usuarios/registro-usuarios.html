<app-header></app-header>

<main>
    <section class="formulario">
        <h2>Crear cuenta</h2>

        <form class="form-registro" [formGroup]="formularioRegistro" (ngSubmit)="onRegister($event)">

            <!-- Nombre -->
            <div class="form-datos">
                <label for="nombre">Nombre de usuario</label>
                <input type="text" id="nombre" name="nombre" formControlName="nombre" placeholder="Introduce tu nombre">

                <div *ngIf="formularioRegistro.get('nombre')?.errors && formularioRegistro.get('nombre')?.touched">
                    <p style="color: red;" *ngIf="formularioRegistro.get('nombre')?.hasError('required')">
                        *Este es un campo requerido.
                    </p>
                    <p style="color: red;" *ngIf="formularioRegistro.get('nombre')?.hasError('minlength')">
                        *Este campo necesita una longitud mínima de 3 caracteres.
                    </p>
                </div>
            </div>

            <!-- Email -->
            <div class="form-datos">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" formControlName="email" placeholder="Introduce tu correo">

                <div *ngIf="formularioRegistro.get('email')?.errors && formularioRegistro.get('email')?.touched">
                    <p *ngIf="formularioRegistro.get('email')?.hasError('required')">*Este campo es obligatorio.</p>
                    <p *ngIf="formularioRegistro.get('email')?.hasError('email')">*Introduce un correo válido.</p>
                </div>
            </div>

            <!-- Contraseña -->
            <div class="form-datos">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" formControlName="password"
                    placeholder="Crea una contraseña">

                <div *ngIf="formularioRegistro.get('password')?.errors && formularioRegistro.get('password')?.touched">
                    <p *ngIf="formularioRegistro.get('password')?.hasError('required')">*Este campo es obligatorio.</p>
                    <p *ngIf="formularioRegistro.get('password')?.hasError('minlength')">*Debe tener al menos 6
                        caracteres.</p>
                </div>
            </div>

            <!-- Botón -->
            <div class="botones">
                <button type="submit" class="btn">Registrarse</button>
            </div>

            <!-- Enlace de inicio de sesión -->
            <p class="registro-texto">
                ¿Ya tienes cuenta?
                <a routerLink="/admin/usuarios" routerLinkActive="active">Inicia sesión aquí</a>
            </p>
        </form>
    </section>
</main>
