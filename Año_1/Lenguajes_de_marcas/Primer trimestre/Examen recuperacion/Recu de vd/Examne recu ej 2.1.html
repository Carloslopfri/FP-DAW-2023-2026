<!DOCTYPE html>
<html lang="es">
    <style>
        /* Estilos para la lista desordenada */
        ul {
          list-style-type: Google Fonts;
          font-family: "Anton", sans-serif;
          font-weight: 400;
          font-style: normal;
          font-size: 16px;
        }
        
    
        /* Estilos para los elementos de la lista */
        li {
          margin-bottom: 10px;
        }
    
        /* Estilos para los enlaces */
        a {
          text-decoration: none;
          color: #0013CC; /* Color de texto por defecto */
          transition: color 0.3s ease; /* Transición suave del color */
        }
    
        /* Estilos para los enlaces al pasar el ratón sobre ellos */
        a:hover {
          color: #CCAA00; /* Color de texto al pasar el ratón */
        }
      </style>    
<head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Informática</title>
</head>
<body>
  <h1>Lista Informática con enlaces</h1>
  <ul>
    <li><a href="https://www.w3.org/">W3C</a></li>
    <li><a href="https://www.google.com/?hl=es">Google</a></li>
    <li><a href="https://www.oracle.com/es/">Oracle</a></li>
  </ul>
</body>
</html>
