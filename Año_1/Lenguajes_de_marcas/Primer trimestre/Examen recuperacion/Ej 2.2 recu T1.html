<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda de Contactos Estilizada</title>
  <style>
    table {
      width: 100%;
      border-collapse: collapse;
      font-family: Arial, sans-serif;
      font-size: 14px;
    }

    th, td {
      border: 1px solid #dddddd;
      padding: 8px;
      text-align: left;
    }

    th {
      background-color: #f2f2f2;
    }

    /* Aplica colores alternos a las filas */
    tbody tr:nth-child(even) {
      background-color: #c8e6c9; /* Verde */
    }

    tbody tr:nth-child(odd) {
      background-color: #ffcdd2; /* Rojo */
    }

    /* Estilo para las celdas de la primera columna */
    td:first-child {
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Agenda de Contactos Estilizada</h1>
  <table>
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Teléfono</th>
        <th>Correo</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Juan Pérez</td>
        <td>555-1234</td>
        <td>juan@example.com</td>
      </tr>
      <tr>
        <td>María García</td>
        <td>555-5678</td>
        <td>maria@example.com</td>
      </tr>
      <tr>
        <td>Carlos López</td>
        <td>555-9012</td>
        <td>carlos@example.com</td>
      </tr>
      <tr>
        <td>Laura Martínez</td>
        <td>555-3456</td>
        <td>laura@example.com</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
