<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Informática Estilizada</title>
  <style>
    /* Estilos para la lista desordenada */
    ul {
      list-style-type: none;
      font-family: Arial, sans-serif;
      font-size: 16px;
    }

    /* Estilos para los elementos de la lista */
    li {
      margin-bottom: 10px;
    }

    /* Estilos para los enlaces */
    a {
      text-decoration: none;
      color: #333; /* Color de texto por defecto */
      transition: color 0.3s ease; /* Transición suave del color */
    }

    /* Estilos para los enlaces al pasar el ratón sobre ellos */
    a:hover {
      color: #007bff; /* Color de texto al pasar el ratón */
    }
  </style>
</head>
<body>
  <h1>Lista de Informática Estilizada</h1>
  <ul>
    <li><a href="https://es.wikipedia.org/wiki/Inteligencia_artificial">Inteligencia Artificial</a></li>
    <li><a href="https://es.wikipedia.org/wiki/Ciberseguridad">Ciberseguridad</a></li>
    <li><a href="https://es.wikipedia.org/wiki/Desarrollo_web">Desarrollo Web</a></li>
    <li><a href="https://es.wikipedia.org/wiki/Big_data">Big Data</a></li>
    <li><a href="https://es.wikipedia.org/wiki/Programaci%C3%B3n_orientada_a_objetos">Programación Orientada a Objetos</a></li>
  </ul>
</body>
</html>
